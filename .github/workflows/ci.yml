name: CI
on: [push, pull_request]
jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      EMBEDDINGS: bm25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: RAG quality gate (fails the build if metrics drop)
        run: python -m rag_eval eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/
